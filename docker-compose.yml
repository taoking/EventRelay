name: eventrelay

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: >
      sh -lc 'test -f .env || cp .env.example .env;
      composer install --no-interaction --prefer-dist --no-progress;
      grep -q "^APP_KEY=base64:" .env || php artisan key:generate --force;
      php artisan serve --host=0.0.0.0 --port=8000'
    environment:
      APP_NAME: EventRelay
      APP_ENV: local
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: eventrelay
      DB_USERNAME: eventrelay
      DB_PASSWORD: eventrelay
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '8000:8000'
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: eventrelay
      MYSQL_USER: eventrelay
      MYSQL_PASSWORD: eventrelay
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - eventrelay-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -proot']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  eventrelay-mysql:
